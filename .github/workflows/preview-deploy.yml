name: Deploy Cloudflare preview

on:
  workflow_run:
    workflows: [Build Cloudflare preview]
    types: [completed]
  pull_request_target:
    branches: [dev]
    types: [closed]

permissions:
  actions: read
  contents: read
  deployments: write
  issues: write
  pull-requests: read

concurrency:
  group: cloudflare-preview-${{ github.event.pull_request.head.repo.id || github.event.workflow_run.head_repository.id }}-${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  WORKER_NAME: 2027-cfs-preview
  WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}

jobs:
  deploy:
    if: github.event_name == 'workflow_run' && github.repository == 'sitcon-tw/2027-cfs'
    name: Deploy PR preview
    runs-on: ubuntu-latest
    steps:
      - name: Validate build source
        id: context
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- cloudflare-preview -->";
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id
            });

            if (run.repository.id !== context.payload.repository.id) {
              throw new Error("The build belongs to a different repository.");
            }
            if (run.event !== "pull_request" || run.path.split("@")[0] !== ".github/workflows/preview-build.yml") {
              throw new Error("The triggering run is not the expected pull request workflow.");
            }
            if (!run.head_repository || !run.head_branch) {
              throw new Error("The triggering run has no source repository or branch.");
            }

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "all",
              base: "dev",
              head: `${run.head_repository.owner.login}:${run.head_branch}`,
              per_page: 100
            });
            const matches = pulls.filter(pull =>
              pull.head.repo?.id === run.head_repository.id &&
              pull.head.sha === run.head_sha
            );
            if (matches.length === 0) {
              core.notice("Ignoring a stale build with no matching pull request head.");
              core.setOutput("deploy", "false");
              return;
            }
            if (matches.length !== 1) {
              throw new Error(`Expected one pull request, found ${matches.length}.`);
            }

            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: matches[0].number
            });

            const current = pull.state === "open" &&
              pull.base.ref === "dev" &&
              pull.head.sha === run.head_sha &&
              pull.head.repo?.id === run.head_repository.id;
            if (!current) {
              core.notice("Ignoring a stale build or a pull request that is no longer open.");
              core.setOutput("deploy", "false");
              return;
            }

            if (!/^[a-z0-9-]+$/.test(process.env.WORKERS_SUBDOMAIN || "")) {
              throw new Error("CLOUDFLARE_WORKERS_SUBDOMAIN is not configured.");
            }

            const previewUrl = `https://pr-${pull.number}-${process.env.WORKER_NAME}.${process.env.WORKERS_SUBDOMAIN}.workers.dev`;
            const { data: deployment } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: pull.head.sha,
              task: "deploy:cloudflare-preview",
              auto_merge: false,
              required_contexts: [],
              environment: `pr-${pull.number}`,
              transient_environment: true,
              production_environment: false,
              description: `Cloudflare preview for PR #${pull.number}`
            });

            const upsertComment = async body => {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pull.number,
                per_page: 100
              });
              const previous = comments.find(comment =>
                comment.user?.login === "github-actions[bot]" && comment.body?.includes(marker)
              );
              const completeBody = `${marker}\n${body}`;
              if (previous) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: previous.id,
                  body: completeBody
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pull.number,
                  body: completeBody
                });
              }
            };

            if (run.conclusion !== "success") {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.id,
                state: "failure",
                environment: `pr-${pull.number}`,
                environment_url: previewUrl,
                description: `Preview build ${run.conclusion}`
              });
              await upsertComment(`❌ Preview build failed for \`${pull.head.sha}\`.\n\n[View workflow run](${run.html_url})`);
              core.setOutput("deploy", "false");
              return;
            }

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.id,
              state: "in_progress",
              environment: `pr-${pull.number}`,
              environment_url: previewUrl,
              description: "Uploading preview to Cloudflare"
            });
            core.setOutput("deploy", "true");
            core.setOutput("deployment_id", deployment.id);
            core.setOutput("pr_number", pull.number);
            core.setOutput("sha", pull.head.sha);
            core.setOutput("url", previewUrl);

      - name: Checkout trusted deployment code
        if: steps.context.outputs.deploy == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download preview artifact
        if: steps.context.outputs.deploy == 'true'
        uses: actions/download-artifact@v4
        with:
          name: preview-site
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify preview artifact
        if: steps.context.outputs.deploy == 'true'
        run: test -f dist/index.html && test -f dist/_headers

      - name: Setup pnpm
        if: steps.context.outputs.deploy == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.context.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install trusted deployment dependencies
        if: steps.context.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile

      - name: Deploy preview
        if: steps.context.outputs.deploy == 'true'
        run: |
          pnpm exec wrangler preview \
            --name "$PREVIEW_NAME" \
            --tag "$PREVIEW_SHA" \
            --message "PR #$PR_NUMBER $PREVIEW_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_NAME: pr-${{ steps.context.outputs.pr_number }}
          PREVIEW_SHA: ${{ steps.context.outputs.sha }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}

      - name: Report successful deployment
        if: success() && steps.context.outputs.deploy == 'true'
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.context.outputs.deployment_id }}
          PREVIEW_SHA: ${{ steps.context.outputs.sha }}
          PREVIEW_URL: ${{ steps.context.outputs.url }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
        with:
          script: |
            const marker = "<!-- cloudflare-preview -->";
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: "success",
              environment: `pr-${process.env.PR_NUMBER}`,
              environment_url: process.env.PREVIEW_URL,
              description: "Preview is ready"
            });
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              per_page: 100
            });
            const previous = comments.find(comment =>
              comment.user?.login === "github-actions[bot]" && comment.body?.includes(marker)
            );
            const body = `${marker}\n✅ Preview: ${process.env.PREVIEW_URL}\n\nCommit: \`${process.env.PREVIEW_SHA}\``;
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(process.env.PR_NUMBER),
                body
              });
            }

      - name: Report failed deployment
        if: failure() && steps.context.outputs.deploy == 'true'
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.context.outputs.deployment_id }}
          PREVIEW_SHA: ${{ steps.context.outputs.sha }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = "<!-- cloudflare-preview -->";
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: "failure",
              environment: `pr-${process.env.PR_NUMBER}`,
              description: "Preview deployment failed"
            });
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              per_page: 100
            });
            const previous = comments.find(comment =>
              comment.user?.login === "github-actions[bot]" && comment.body?.includes(marker)
            );
            const body = `${marker}\n❌ Preview deployment failed for \`${process.env.PREVIEW_SHA}\`.\n\n[View workflow run](${process.env.RUN_URL})`;
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(process.env.PR_NUMBER),
                body
              });
            }

  cleanup:
    if: github.event_name == 'pull_request_target' && github.repository == 'sitcon-tw/2027-cfs'
    name: Delete closed PR preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted deployment code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install trusted deployment dependencies
        run: pnpm install --frozen-lockfile

      - name: Delete preview
        run: pnpm exec wrangler preview delete --name "$PREVIEW_NAME" --worker-name "$WORKER_NAME" --skip-confirmation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_NAME: pr-${{ github.event.pull_request.number }}

      - name: Mark preview inactive
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const marker = "<!-- cloudflare-preview -->";
            const prNumber = Number(process.env.PR_NUMBER);
            const { data: deployments } = await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment: `pr-${prNumber}`,
              per_page: 1
            });
            if (deployments[0]) {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployments[0].id,
                state: "inactive",
                environment: `pr-${prNumber}`,
                description: "Pull request closed"
              });
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100
            });
            const previous = comments.find(comment =>
              comment.user?.login === "github-actions[bot]" && comment.body?.includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body: `${marker}\n🗑️ Preview removed because the pull request was closed.`
              });
            }
