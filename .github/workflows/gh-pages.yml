name: Build CFS site

# Builds the site for sitcon.org/2027/cfs/ and publishes it to the `build`
# branch, then triggers sitcon-tw/2027's "Deploy website" workflow, which
# copies that branch into its GitHub Pages output. The trigger needs the
# DEPLOY_DISPATCH_TOKEN secret: a fine-grained token with Actions read and
# write on sitcon-tw/2027 (the default GITHUB_TOKEN can't reach other repos).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cfs-build
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main' && github.repository == 'sitcon-tw/2027-cfs'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch sponsorship data and images
        run: pnpm fetch-data

      - name: Check Astro project
        run: pnpm test

      - name: Build CFS
        run: pnpm build

      - name: Publish generated files
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: build
          publish_dir: ./dist

      - name: Trigger sitcon-tw/2027 deploy
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
        run: |
          gh workflow run deploy.yml --repo sitcon-tw/2027 --ref main
          echo "Built CFS source $GITHUB_SHA and triggered the sitcon-tw/2027 \"Deploy website\" workflow to publish it." >> "$GITHUB_STEP_SUMMARY"
