name: Build CFS site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cfs-build
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main' && github.repository == 'sitcon-tw/2027-cfs'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch sponsorship data and images
        run: pnpm fetch-data

      - name: Check Astro project
        run: pnpm test

      - name: Build CFS
        run: pnpm build

      - name: Publish generated files
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: build
          publish_dir: ./dist

      - name: Record source revision
        run: echo "Built CFS source $GITHUB_SHA. Run the sitcon-tw/2027 deployment to publish this output." >> "$GITHUB_STEP_SUMMARY"
